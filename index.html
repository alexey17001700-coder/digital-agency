<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Штаб: Броня</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; }
        
        /* Окно, в котором живет наш Штаб (app.html) */
        #app-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        /* Неубиваемая кнопка отката */
        #rollback-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99999;
            background: #ff0055;
            color: #fff;
            border: 2px solid #ff88aa;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 0, 85, 0.6);
            transition: all 0.3s;
        }

        #rollback-btn:active {
            transform: scale(0.95);
            background: #cc0044;
        }
    </style>
</head>
<body>
    <!-- Загружаем сам Штаб внутрь этого окна -->
    <iframe id="app-frame" src="app.html"></iframe>

    <!-- Наша спасительная кнопка -->
    <button id="rollback-btn" onclick="triggerRollback()">⏪ Откат Штаба</button>

    <script>
              const PROXY = "https://functions.yandexcloud.net/d4e23q4ie5a8ubg4rn8d";
        const rollbackBtn = document.getElementById('rollback-btn');
        const appFrame = document.getElementById('app-frame');

        async function triggerRollback() {
            if (!confirm("⚠️ Вы уверены, что хотите откатить Штаб до предыдущей рабочей версии?")) {
                return;
            }

            const originalText = rollbackBtn.innerText;
            rollbackBtn.innerText = "⏳ Откат...";
            rollbackBtn.disabled = true;
            rollbackBtn.style.background = "#ffaa00";

            try {
                const response = await fetch(PROXY, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ isRollback: true })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    rollbackBtn.innerText = "✅ Откачено!";
                    rollbackBtn.style.background = "#00ff00";
                    rollbackBtn.style.color = "#000";
                    
                    // Принудительно перезагружаем iframe с app.html (добавляем ?v= для сброса кэша)
                    setTimeout(() => {
                        appFrame.src = "app.html?v=" + Date.now(); 
                        
                        // Возвращаем кнопку в исходное состояние через 2 секунды
                        setTimeout(() => {
                            rollbackBtn.innerText = originalText;
                            rollbackBtn.style.background = "#ff0055";
                            rollbackBtn.style.color = "#fff";
                            rollbackBtn.disabled = false;
                        }, 2000); 
                    }, 1000);
                } else {
                    throw new Error(data.error || "Неизвестная ошибка");
                }
            } catch (e) {
                alert("❌ Ошибка отката: " + e.message);
                rollbackBtn.innerText = originalText;
                rollbackBtn.style.background = "#ff0055";
                rollbackBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
