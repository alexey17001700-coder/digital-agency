<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровое Агентство (GigaChat Real)</title>
    <style>
        body { background-color: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        h1 { color: #00e5ff; text-align: center; font-size: 22px; }
        .chat-container { background: #121212; border: 2px solid #ffd700; border-radius: 10px; padding: 15px; height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .msg-director { background: #2c3e50; color: #ffd700; align-self: flex-start; }
        .msg-boss { background: #005662; color: #fff; align-self: flex-end; }
        .input-area { display: flex; gap: 10px; margin-top: 20px; }
        input[type="text"] { flex-grow: 1; padding: 12px; border-radius: 25px; border: 1px solid #333; background: #1e1e1e; color: white; }
        button.send-btn { padding: 12px 20px; background: #00e5ff; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🏢 Агентство (GigaChat)</h1>
    <div class="chat-container" id="chatContainer">
        <div class="chat-msg msg-director">Босс, Директор на связи. Я подключен к GigaChat. Жду задачу!</div>
    </div>
    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Написать задачу..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        
        // Берем Authorization Key из ссылки (тот, что начинается на Base64-строку из Сбера)
        const urlParams = new URLSearchParams(window.location.search);
        const GIGACHAT_AUTH_KEY = urlParams.get('key') || "";

        // Используем бесплатный прокси для обхода CORS
        const PROXY = "https://corsproxy.io/?";
        
        // Функция для получения токена (живет 30 минут)
        async function getAccessToken() {
            if (!GIGACHAT_AUTH_KEY) throw new Error("Нет ключа авторизации GigaChat в ссылке");
            
            const response = await fetch(PROXY + "https://ngw.devices.sberbank.ru:9443/api/v2/oauth", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "Accept": "application/json",
                    "RqUID": crypto.randomUUID(),
                    "Authorization": "Basic " + GIGACHAT_AUTH_KEY // Sber требует Basic auth с ключом
                },
                body: "scope=GIGACHAT_API_PERS"
            });
            
            const data = await response.json();
            if (!data.access_token) throw new Error("Не удалось получить токен: " + JSON.stringify(data));
            return data.access_token;
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = 'chat-msg msg-' + sender;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, 'boss');
            input.value = '';
            
            if (!GIGACHAT_AUTH_KEY) {
                addMessage("Ошибка: Добавь ?key=ТВОЙ_КЛЮЧ в конец адреса сайта.", 'director');
                return;
            }

            try {
                // 1. Получаем свежий токен (обходим проблему 30 минут)
                const token = await getAccessToken();
                
                // 2. Отправляем запрос в GigaChat через прокси
                const response = await fetch(PROXY + "https://gigachat.devices.sberbank.ru/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        model: "GigaChat-2-Max", // Берем самую мощную модель [citation:5]
                        messages: [{ role: "user", content: text }]
                    })
                });
                
                const data = await response.json();
                
                if (data.choices && data.choices.length > 0) {
                    addMessage(data.choices[0].message.content, 'director');
                } else {
                    addMessage("Ошибка GigaChat: " + JSON.stringify(data), 'director');
                }
            } catch (e) {
                addMessage("Системная ошибка: " + e.message, 'director');
            }
        }
    </script>
</body>
</html>
