<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крестики-нолики</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1e2a44 0%, #0b1120 100%);
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    color: #e8eefc;
    user-select: none;
  }
  h1 {
    font-size: 2rem;
    letter-spacing: 2px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #status {
    font-size: 1.2rem;
    margin-bottom: 20px;
    min-height: 28px;
    color: #9fb3d1;
    transition: color .2s;
  }
  #status.win { color: #4ade80; font-weight: 700; }
  #status.draw { color: #fbbf24; font-weight: 700; }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 10px;
    padding: 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    font-weight: 700;
    background: rgba(255,255,255,0.06);
    border-radius: 14px;
    cursor: pointer;
    transition: transform .12s, background .2s;
  }
  .cell:hover:not(.taken) { background: rgba(79,172,254,0.18); transform: scale(1.04); }
  .cell.taken { cursor: default; }
  .cell.x { color: #4facfe; text-shadow: 0 0 18px rgba(79,172,254,.7); }
  .cell.o { color: #f472b6; text-shadow: 0 0 18px rgba(244,114,182,.7); }
  .cell.win-cell { background: rgba(74,222,128,0.25); }
  .cell.pop { animation: pop .25s ease; }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  #reset {
    margin-top: 24px;
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1px;
    color: #0b1120;
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s;
  }
  #reset:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(79,172,254,.5); }
  #reset:active { transform: translateY(0); }
</style>
</head>
<body>
  <h1>КРЕСТИКИ-НОЛИКИ</h1>
  <div id="status">Ход: X</div>
  <div class="board" id="board"></div>
  <button id="reset">Заново</button>

<script>
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset');

  const WINS = [
    [0,1,2],[3,4,5],[6,7,8], // строки
    [0,3,6],[1,4,7],[2,5,8], // столбцы
    [0,4,8],[2,4,6]          // диагонали
  ];

  let board, current, over;

  function init() {
    board = Array(9).fill('');
    current = 'X';
    over = false;
    boardEl.innerHTML = '';
    statusEl.textContent = 'Ход: X';
    statusEl.className = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.addEventListener('click', () => play(i, cell));
      boardEl.appendChild(cell);
    }
  }

  function play(i, cell) {
    if (over || board[i]) return;
    board[i] = current;
    cell.textContent = current;
    cell.classList.add('taken', current.toLowerCase(), 'pop');

    const win = checkWin(current);
    if (win) {
      over = true;
      win.forEach(idx => boardEl.children[idx].classList.add('win-cell'));
      statusEl.textContent = `Победил ${current}! 🎉`;
      statusEl.className = 'win';
      return;
    }
    if (board.every(v => v)) {
      over = true;
      statusEl.textContent = 'Ничья! 🤝';
      statusEl.className = 'draw';
      return;
    }
    current = current === 'X' ? 'O' : 'X';
    statusEl.textContent = `Ход: ${current}`;
  }

  function checkWin(p) {
    for (const combo of WINS) {
      if (combo.every(idx => board[idx] === p)) return combo;
    }
    return null;
  }

  resetBtn.addEventListener('click', init);
  init();
</script>
</body>
</html>
