<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Штаб: Броня</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        
        /* Окно, в котором живет наш Штаб (app.html) */
        #app-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }

        /* Контейнер для пульта управления */
        #control-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
        }

        /* Сама пульсирующая круглая кнопка */
        #fab-trigger {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #1e1e1e;
            border: 2px solid #ffd700;
            color: #ffd700;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            animation: pulse-ring 2s infinite;
            transition: transform 0.2s;
        }

        #fab-trigger:active {
            transform: scale(0.9);
        }

        /* Анимация пульсации */
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        /* Выпадающее окно (скрыто по умолчанию) */
        #fab-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #444;
            border-radius: 16px;
            padding: 15px;
            width: 220px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            animation: slide-up 0.3s ease;
        }

        #fab-menu.open {
            display: flex;
        }

        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Кнопки внутри меню */
        .fab-btn {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .fab-btn:active {
            transform: scale(0.96);
        }

        .fab-btn .title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .fab-btn .desc {
            font-size: 10px;
            opacity: 0.8;
            line-height: 1.3;
        }

        /* Стили для кнопки Бэкапа */
        .btn-backup {
            background: rgba(0, 200, 100, 0.15);
            color: #00ff88;
            border: 1px solid rgba(0, 200, 100, 0.3);
        }

        /* Стили для кнопки Отката */
        .btn-rollback {
            background: rgba(255, 0, 85, 0.15);
            color: #ff4477;
            border: 1px solid rgba(255, 0, 85, 0.3);
        }

        /* Оверлей для закрытия меню по клику вне его */
        #fab-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 99998;
        }
        #fab-overlay.open {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Загружаем сам Штаб внутрь этого окна -->
    <iframe id="app-frame" src="app.html"></iframe>

    <!-- Затемняющий фон для закрытия меню -->
    <div id="fab-overlay" onclick="toggleMenu()"></div>

    <!-- Пульт управления -->
    <div id="control-panel">
        <div id="fab-menu">
            <button class="fab-btn btn-backup" onclick="triggerBackup()">
                <span class="title">💾 Сохранить эталон</span>
                <span class="desc">Сделать текущую версию Штаба базовой для отката.</span>
            </button>
            <button class="fab-btn btn-rollback" onclick="triggerRollback()">
                <span class="title">⏪ Откатить Штаб</span>
                <span class="desc">Вернуть Штаб к последней сохраненной версии.</span>
            </button>
        </div>
        
        <button id="fab-trigger" onclick="toggleMenu()">🛠️</button>
    </div>

    <script>
        const PROXY = "https://functions.yandexcloud.net/d4e23q4ie5a8ubg4rn8d";
        const fabMenu = document.getElementById('fab-menu');
        const fabOverlay = document.getElementById('fab-overlay');
        const appFrame = document.getElementById('app-frame');

        function toggleMenu() {
            fabMenu.classList.toggle('open');
            fabOverlay.classList.toggle('open');
        }

        async function triggerBackup() {
            toggleMenu(); // Закрываем меню
            if (!confirm("💾 Сделать текущую версию Штаба новым эталоном? (Это перезапишет старый бэкап)")) {
                return;
            }

            const btn = document.querySelector('.btn-backup');
            btn.innerHTML = '<span class="title">⏳ Сохранение...</span>';

            try {
                const response = await fetch(PROXY, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ isBackup: true })
                });
                const data = await response.json();
                
                if (data.success) {
                    alert("✅ Текущая версия успешно сохранена как эталон!");
                } else {
                    throw new Error(data.error || "Неизвестная ошибка");
                }
            } catch (e) {
                alert("❌ Ошибка сохранения: " + e.message);
            } finally {
                btn.innerHTML = '<span class="title">💾 Сохранить эталон</span><span class="desc">Сделать текущую версию Штаба базовой для отката.</span>';
            }
        }

        async function triggerRollback() {
            toggleMenu(); // Закрываем меню
            if (!confirm("⚠️ Вы уверены, что хотите откатить Штаб до предыдущей рабочей версии?")) {
                return;
            }

            const btn = document.querySelector('.btn-rollback');
            btn.innerHTML = '<span class="title">⏳ Откат...</span>';

            try {
                const response = await fetch(PROXY, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ isRollback: true })
                });
                const data = await response.json();
                
                if (data.success) {
                    alert("✅ Откат выполнен! Сайт сейчас перезагрузится.");
                    appFrame.src = "app.html?v=" + Date.now(); // Принудительная перезагрузка iframe
                } else {
                    throw new Error(data.error || "Неизвестная ошибка");
                }
            } catch (e) {
                alert("❌ Ошибка отката: " + e.message);
            } finally {
                btn.innerHTML = '<span class="title">⏪ Откатить Штаб</span><span class="desc">Вернуть Штаб к последней сохраненной версии.</span>';
            }
        }
    </script>
</body>
</html>
