<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Крестики-нолики</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0a0a0a 70%);
    font-family: 'Segoe UI', sans-serif; color: #eee; padding: 20px;
  }
  h1 { margin: 0; font-size: 24px; letter-spacing: 2px; color: #00e5ff;
       text-shadow: 0 0 12px rgba(0,229,255,.5); text-transform: uppercase; }
  .status { font-size: 18px; font-weight: bold; min-height: 24px; color: #ffd700; }
  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    background: #1e1e1e; padding: 8px; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.7), 0 0 0 2px #333 inset;
  }
  .cell {
    width: 90px; height: 90px; border: none; border-radius: 12px;
    background: #121212; font-size: 48px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .15s, transform .1s;
    color: #fff; font-family: 'Segoe UI', sans-serif;
  }
  .cell:active { transform: scale(.95); }
  .cell.x { color: #00e5ff; text-shadow: 0 0 15px rgba(0,229,255,.7); }
  .cell.o { color: #ff4477; text-shadow: 0 0 15px rgba(255,68,119,.7); }
  .cell.win { background: #0d3b3b; animation: winpulse .6s infinite alternate; }
  @keyframes winpulse { from { box-shadow: 0 0 5px #00e5ff; } to { box-shadow: 0 0 25px #00e5ff; } }
  .cell:disabled { cursor: default; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button.ctrl {
    padding: 12px 20px; border-radius: 10px; border: 1px solid #444;
    background: #1e1e1e; color: #eee; font-size: 15px; cursor: pointer;
    transition: background .15s;
  }
  button.ctrl:hover { background: #2a2a2a; }
  button.ctrl.active { background: #005662; color: #00e5ff; border-color: #00e5ff; }
  .score { display: flex; gap: 20px; font-size: 14px; color: #aaa; }
  .score b { color: #fff; font-size: 18px; }
</style>
</head>
<body>
  <h1>Крестики-нолики</h1>
  <div class="status" id="status">Ход: X</div>
  <div class="board" id="board"></div>
  <div class="controls">
    <button class="ctrl active" id="modeAI">🤖 Против ИИ</button>
    <button class="ctrl" id="modePvP">👥 На двоих</button>
    <button class="ctrl" id="reset">🔄 Заново</button>
  </div>
  <div class="score">
    <span>X: <b id="sx">0</b></span>
    <span>O: <b id="so">0</b></span>
    <span>Ничьи: <b id="sd">0</b></span>
  </div>

<script>
  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board = Array(9).fill('');
  let current = 'X';
  let gameOver = false;
  let vsAI = true;
  let scores = { X: 0, O: 0, D: 0 };

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const sxEl = document.getElementById('sx');
  const soEl = document.getElementById('so');
  const sdEl = document.getElementById('sd');
  const modeAI = document.getElementById('modeAI');
  const modePvP = document.getElementById('modePvP');

  function buildBoard() {
    boardEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const b = document.createElement('button');
      b.className = 'cell';
      b.dataset.i = i;
      b.addEventListener('click', () => handleClick(i));
      boardEl.appendChild(b);
    }
  }

  function render() {
    const cells = boardEl.children;
    for (let i = 0; i < 9; i++) {
      const c = cells[i];
      c.textContent = board[i];
      c.className = 'cell' + (board[i] ? ' ' + board[i].toLowerCase() : '');
      c.disabled = gameOver || board[i] !== '';
    }
  }

  function handleClick(i) {
    if (gameOver || board[i] !== '') return;
    place(i, current);
    if (checkEnd()) return;
    current = current === 'X' ? 'O' : 'X';
    updateStatus();
    if (vsAI && current === 'O' && !gameOver) {
      setTimeout(aiMove, 250);
    }
  }

  function place(i, player) {
    board[i] = player;
    render();
  }

  function aiMove() {
    if (gameOver) return;
    const move = bestMove();
    place(move, 'O');
    if (checkEnd()) return;
    current = 'X';
    updateStatus();
  }

  function bestMove() {
    // 1. Победный ход
    let m = findLine('O');
    if (m !== -1) return m;
    // 2. Блокировка X
    m = findLine('X');
    if (m !== -1) return m;
    // 3. Центр
    if (board[4] === '') return 4;
    // 4. Углы
    const corners = [0,2,6,8].filter(i => board[i] === '');
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
    // 5. Любая свободная
    const free = board.map((v,i) => v === '' ? i : -1).filter(i => i !== -1);
    return free[Math.floor(Math.random() * free.length)];
  }

  function findLine(player) {
    for (const [a,b,c] of WIN_LINES) {
      const line = [board[a], board[b], board[c]];
      const count = line.filter(v => v === player).length;
      const empty = line.filter(v => v === '').length;
      if (count === 2 && empty === 1) {
        if (board[a] === '') return a;
        if (board[b] === '') return b;
        if (board[c] === '') return c;
      }
    }
    return -1;
  }

  function checkEnd() {
    for (const line of WIN_LINES) {
      const [a,b,c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        gameOver = true;
        highlight(line);
        scores[board[a]]++;
        updateScore();
        statusEl.textContent = '🏆 Победил ' + board[a] + '!';
        statusEl.style.color = board[a] === 'X' ? '#00e5ff' : '#ff4477';
        render();
        return true;
      }
    }
    if (board.every(v => v !== '')) {
      gameOver = true;
      scores.D++;
      updateScore();
      statusEl.textContent = '🤝 Ничья!';
      statusEl.style.color = '#ffd700';
      return true;
    }
    return false;
  }

  function highlight(line) {
    const cells = boardEl.children;
    line.forEach(i => cells[i].classList.add('win'));
  }

  function updateStatus() {
    statusEl.textContent = 'Ход: ' + current;
    statusEl.style.color = '#ffd700';
  }

  function updateScore() {
    sxEl.textContent = scores.X;
    soEl.textContent = scores.O;
    sdEl.textContent = scores.D;
  }

  function reset() {
    board = Array(9).fill('');
    current = 'X';
    gameOver = false;
    updateStatus();
    render();
  }

  modeAI.addEventListener('click', () => {
    vsAI = true;
    modeAI.classList.add('active');
    modePvP.classList.remove('active');
    reset();
  });

  modePvP.addEventListener('click', () => {
    vsAI = false;
    modePvP.classList.add('active');
    modeAI.classList.remove('active');
    reset();
  });

  document.getElementById('reset').addEventListener('click', reset);

  buildBoard();
  render();
  updateStatus();
</script>
</body>
</html>
