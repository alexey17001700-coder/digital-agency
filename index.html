<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Цифровое Агентство — Штаб</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  #splash { position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; align-items: center; justify-content: center; transition: opacity .6s; }
  #matrix { position: absolute; inset: 0; display: block; }
  .splash-logo { position: relative; z-index: 2; color: #00e5ff; font-size: 20px; letter-spacing: 6px; text-shadow: 0 0 20px #00e5ff; animation: pulse 1.4s ease-in-out infinite; text-align: center; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0a0a0a; }
  #toolsBtn { position: fixed; right: 12px; bottom: 12px; z-index: 10001; width: 46px; height: 46px; border-radius: 50%; background: #0a0a0a; color: #00e5ff; border: 2px solid #00e5ff; font-size: 20px; cursor: pointer; box-shadow: 0 0 20px rgba(0,229,255,.5); }
  #panel { display: none; position: fixed; right: 12px; bottom: 68px; z-index: 10001; width: 230px; background: #0a0a0a; border: 2px solid #00e5ff; border-radius: 12px; padding: 14px; color: #00e5ff; box-shadow: 0 0 25px rgba(0,229,255,.5); }
  #panel.open { display: block; }
  #panel h3 { margin: 0 0 12px; font-size: 13px; letter-spacing: 2px; text-align: center; }
  #panel input { width: 100%; padding: 9px; background: #000; border: 1px solid #00e5ff; color: #00e5ff; border-radius: 6px; font-family: inherit; font-size: 14px; text-align: center; letter-spacing: 4px; }
  #panel button { width: 100%; margin-top: 9px; padding: 10px; background: transparent; border: 1px solid #00e5ff; color: #00e5ff; border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; transition: .15s; }
  #panel button:active { background: #00e5ff; color: #000; }
  #panel button.danger { border-color: #ff0055; color: #ff0055; }
  #panel button.danger:active { background: #ff0055; color: #fff; }
  #panelStatus { margin-top: 10px; font-size: 11px; color: #8fdfff; min-height: 14px; text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="splash"><canvas id="matrix"></canvas><div class="splash-logo">ЦИФРОВОЕ АГЕНТСТВО</div></div>

  <iframe id="frame" title="Штаб"></iframe>

  <div id="panel">
    <h3>🛠️ ПАНЕЛЬ ШТАБА</h3>
    <div id="safeGate">
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="PIN">
      <button onclick="checkPin()">🔓 Открыть сейф</button>
    </div>
    <div id="safeBox" class="hidden">
      <button onclick="doBackup()">💾 Сохранить эталон</button>
      <button class="danger" onclick="doRollback()">⏪ Откатить Штаб</button>
    </div>
    <div id="panelStatus"></div>
  </div>
  <button id="toolsBtn" onclick="togglePanel()">🛠️</button>

<script>
  const PROXY = "https://shtab-boss.duckdns.org:8443";
  const SAFE_PIN = "8452";

  // Загружаем Штаб в iframe с защитой от кэша
  (function () {
    const frame = document.getElementById('frame');
    frame.src = 'app.html?v=' + Date.now();
  })();

  function togglePanel() {
    document.getElementById('panel').classList.toggle('open');
  }

  function setStatus(text) {
    document.getElementById('panelStatus').textContent = text || '';
  }

  function checkPin() {
    const val = document.getElementById('pinInput').value.trim();
    if (val === SAFE_PIN) {
      document.getElementById('safeGate').classList.add('hidden');
      document.getElementById('safeBox').classList.remove('hidden');
      setStatus('Сейф открыт ✅');
    } else {
      setStatus('Неверный PIN ❌');
    }
  }

  async function callProxy(payload) {
    setStatus('Связь с сервером...');
    try {
      const res = await fetch(PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      setStatus(data.success ? 'Готово ✅' : ('Ошибка: ' + (data.error || 'неизвестно')));
    } catch (e) {
      setStatus('Сбой сети: ' + e.message);
    }
  }

  function doBackup() { callProxy({ isBackup: true }); }

  function doRollback() {
    if (confirm('Откатить Штаб к сохранённому эталону?')) callProxy({ isRollback: true });
  }

  // Матрица на заставке
  (function () {
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    const chars = '01アイウエオカキクケコサシスセソタチツテトABCDEFGHIJKLMNOPQRSTUVWXYZ';
    let cols, drops;
    function init() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      cols = Math.floor(canvas.width / 16);
      drops = new Array(cols).fill(1);
    }
    init();
    window.addEventListener('resize', init);
    setInterval(function () {
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00e5ff';
      ctx.font = '16px monospace';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 16, drops[i] * 16);
        if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }, 50);
  })();

  // Прячем заставку
  window.addEventListener('load', function () {
    setTimeout(function () {
      const s = document.getElementById('splash');
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 650);
    }, 1600);
  });
</script>
</body>
</html>
