
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кнопка Приветствия</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        #greeting-button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #greeting-button:hover {
            background-color: #45a049;
        }

        #greeting-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <button id="greeting-button">Нажми на меня!</button>

    <script>
        document.getElementById('greeting-button').addEventListener('click', function() {
            alert('Привет, мир!');
        });
    </script>
</body>
</html>
