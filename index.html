<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровое Агентство (Автономный режим)</title>
    <style>
        body { background-color: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        h1 { color: #00e5ff; text-align: center; font-size: 22px; }
        .chat-container { background: #121212; border: 2px solid #ffd700; border-radius: 10px; padding: 15px; height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
        .msg-director { background: #2c3e50; color: #ffd700; align-self: flex-start; }
        .msg-boss { background: #005662; color: #fff; align-self: flex-end; }
        .input-area { display: flex; gap: 10px; margin-top: 20px; }
        input[type="text"] { flex-grow: 1; padding: 12px; border-radius: 25px; border: 1px solid #333; background: #1e1e1e; color: white; }
        button.send-btn { padding: 12px 20px; background: #00e5ff; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🏢 Автономный Штаб</h1>
    <div class="chat-container" id="chatContainer">
        <div class="chat-msg msg-director">Босс, Директор на связи. Мы перешли на автономный режим. Введи задачу (например, "код", "идея", "план").</div>
    </div>
    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Написать задачу..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
    <script>
        const chatContainer = document.getElementById('chatContainer');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = 'chat-msg msg-' + sender;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim().toLowerCase();
            if (!text) return;
            
            addMessage(text, 'boss');
            input.value = '';

            let response = "Босс, я тебя понял. Архитектор уже пишет код, Ревизор проверяет.";
            
            if (text.includes("код") || text.includes("сайт") || text.includes("игра")) {
                response = "Архитектор (Ассистент №2): Босс, для этого нужен JavaScript. Я напишу функцию, а Тестировщик прогонит её. Давай сделаем простую игру в браузере?";
            } else if (text.includes("идея") || text.includes("придумай")) {
                response = "Мечтатель (Ассистент №1): Босс! Давай сделаем ИИ-агента, который будет писать посты для Telegram. Это сейчас тренд!";
            } else if (text.includes("план") || text.includes("сделать")) {
                response = "Оркестратор: Босс, вот план:\n1. Архитектор пишет ТЗ.\n2. Фронтенд делает интерфейс.\n3. Тестировщик проверяет.\n4. Сборщик публикует. Начинаем?";
            } else if (text.includes("хак") || text.includes("безопас")) {
                response = "Охранник (Ассистент №3): Босс, я проверил наш Штаб. Уязвимостей нет, все ключи в безопасности. Хакер (Red Team) тоже молчит, взломать не смог.";
            } else if (text.includes("привет") || text.includes("здрав")) {
                response = "Директор: Приветствую, Босс! Штаб в полном составе, все 24 агента готовы к работе. Какие будут приказы?";
            } else {
                response = "Директор: Принял задачу в работу. Раздал указания Архитектору и Тестировщику. Что-нибудь еще?";
            }

            setTimeout(() => {
                addMessage(response, 'director');
            }, 500);
        }
    </script>
</body>
        </html>
