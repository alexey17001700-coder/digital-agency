<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Штаб: Броня</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0a'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='60'>👑</text></svg>">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; position: fixed; top: 0; left: 0; }
        /* Кадр Штаба = ровно видимая область экрана.
           100vh на телефоне — это высота БЕЗ адресной строки (большой вьюпорт),
           поэтому низ кадра (поле ввода + панель агентов) прятался под адресной
           строкой браузера. 100% от body (position:fixed) = видимая область. */
        #app-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: block; }
        #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #0a0a0a; z-index: 9999999; overflow: hidden; display: flex; justify-content: center; align-items: center; transition: opacity 0.8s ease-out, visibility 0.8s; }
        #splash-screen.hidden { opacity: 0; visibility: hidden; }
        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .splash-content { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .splash-logo { font-size: 80px; margin-bottom: 20px; animation: float-crown 2s infinite ease-in-out, glow-crown 1.5s infinite alternate; }
        @keyframes float-crown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes glow-crown { from { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5)); } to { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 1)); } }
        .splash-title { color: #00e5ff; font-size: 18px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); animation: pulse-text 2s infinite alternate; }
        @keyframes pulse-text { from { opacity: 0.7; } to { opacity: 1; } }
        .splash-loader-bar { width: 200px; height: 4px; background: #1e1e1e; border-radius: 10px; overflow: hidden; position: relative; }
        .splash-loader-bar::after { content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 50%; background: #00e5ff; border-radius: 10px; animation: loading 1.5s infinite ease-in-out; box-shadow: 0 0 10px #00e5ff; }
        @keyframes loading { 0% { left: -50%; } 100% { left: 100%; } }
        #ai-loading-status { margin-top: 15px; font-size: 13px; color: #00e5ff; text-align: center; font-family: monospace; font-weight: bold; }
        #ai-loading-bar-container { width: 220px; height: 6px; background: #1e1e1e; border-radius: 4px; margin-top: 8px; }
        #ai-loading-progress { height: 100%; width: 0%; background: #00e5ff; border-radius: 4px; transition: width 0.3s; }
        #ai-model-list { font-size: 11px; color: #ccc; margin-top: 10px; text-align: left; width: 220px; font-family: monospace; line-height: 1.6; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 5px; }
        #control-panel { position: fixed; top: 10px; right: 10px; z-index: 99999; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        #fab-trigger { width: 40px; height: 40px; border-radius: 50%; background: #1e1e1e; border: 2px solid #ffd700; color: #ffd700; font-size: 18px; display: flex; justify-content: center; align-items: center; cursor: pointer; animation: pulse-ring 2s infinite; }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); } }
        #fab-menu { display: none; flex-direction: column; gap: 10px; background: rgba(30, 30, 30, 0.95); border: 1px solid #444; border-radius: 16px; padding: 15px; width: 240px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: absolute; top: 50px; right: 0; }
        #fab-menu.open { display: flex; }
        .fab-btn { display: flex; flex-direction: column; align-items: flex-start; padding: 12px; border-radius: 10px; border: none; cursor: pointer; text-align: left; }
        .btn-backup { background: rgba(0, 200, 100, 0.15); color: #00ff88; border: 1px solid rgba(0, 200, 100, 0.3); }
        .btn-rollback { background: rgba(255, 0, 85, 0.15); color: #ff4477; border: 1px solid rgba(255, 0, 85, 0.3); margin-top: 5px; }
        #safe-lock-container { display: flex; flex-direction: column; align-items: center; background: #121212; border-radius: 12px; padding: 10px; }
        #safe-display { width: 100%; background: #000; color: #00e5ff; font-family: monospace; font-size: 20px; text-align: center; padding: 8px 0; border-radius: 5px; margin-bottom: 10px; border: 1px solid #333; letter-spacing: 5px; }
        .safe-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 100%; }
        .safe-key { background: #2a2a2a; color: #fff; border: none; border-radius: 5px; padding: 10px 0; font-size: 16px; cursor: pointer; }
        .safe-key.ok { background: #005662; color: #00e5ff; font-weight: bold; font-size: 12px; }
        .safe-key.clear { background: #662222; color: #ff8888; }
        #fab-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99998; }
        #fab-overlay.open { display: block; }

        /* === ПРЕВЬЮ «ЧТО УМЕЕТ ШТАБ» — ВИДЕО-ИНСТРУКЦИЯ ПОСЛЕ ЗАСТАВКИ ===
           Босс: «хочу, чтобы как видео выглядело, типа инструкции».
           Поэтому это не карусель карточек, а ПЛЕЕР: сегментный таймлайн,
           сцены с анимацией, авто-прокрутка, «озвучка»-субтитры и кнопки
           ⏮ ⏸ ⏭ + счётчик времени. */
        #features-preview { position: fixed; inset: 0; z-index: 9999998; background: radial-gradient(circle at 50% 14%, #0d1b22 0%, #050505 74%); display: none; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; opacity: 0; transition: opacity 0.5s ease; }
        #features-preview.show { display: flex; opacity: 1; }
        #preview-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.16; }
        .pv-player { position: relative; z-index: 1; width: 100%; max-width: 460px; height: 100%; display: flex; flex-direction: column; padding: 14px 16px; box-sizing: border-box; }
        .pv-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .pv-badge { font-size: 10px; letter-spacing: 1.5px; color: #00e5ff; border: 1px solid rgba(0,229,255,0.4); border-radius: 20px; padding: 3px 10px; }
        .pv-rec { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: #ff6688; letter-spacing: 1px; }
        .pv-rec .rec-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff0055; animation: pvRec 1.2s infinite; }
        @keyframes pvRec { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
        .pv-skip { margin-left: auto; color: #8b98a5; font-size: 12px; cursor: pointer; border: 1px solid #333; border-radius: 20px; padding: 5px 12px; background: rgba(20,20,20,0.8); }
        .pv-timeline { display: flex; gap: 5px; margin-bottom: 14px; }
        .pv-seg { flex: 1; height: 4px; background: #1c2a30; border-radius: 3px; overflow: hidden; }
        .pv-seg i { display: block; height: 100%; width: 0%; background: #00e5ff; box-shadow: 0 0 8px #00e5ff; }
        .pv-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 6px; min-height: 0; }
        .pv-scene { display: none; flex-direction: column; align-items: center; }
        .pv-scene.on { display: flex; animation: pvIn 0.5s ease; }
        @keyframes pvIn { from { opacity: 0; transform: translateY(18px) scale(0.96); } to { opacity: 1; transform: none; } }
        .pv-icon { font-size: 68px; filter: drop-shadow(0 0 18px rgba(0,229,255,0.45)); animation: pvFloat 3s infinite ease-in-out; }
        @keyframes pvFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .pv-name { color: #00e5ff; font-size: 22px; font-weight: bold; letter-spacing: 2px; margin: 14px 0 10px; text-shadow: 0 0 14px rgba(0,229,255,0.5); }
        .pv-text { color: #cfd8dc; font-size: 14px; line-height: 1.6; max-width: 340px; }
        .pv-tag { margin-top: 14px; font-size: 10px; color: #00ff88; border: 1px solid rgba(0,255,136,0.35); border-radius: 20px; padding: 3px 12px; letter-spacing: 1.5px; }
        .pv-caption { margin-top: 12px; min-height: 36px; background: rgba(0,0,0,0.55); border-left: 3px solid #00e5ff; border-radius: 6px; padding: 8px 12px; color: #9fd8e6; font-size: 12px; line-height: 1.45; text-align: left; font-family: monospace; }
        .pv-controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 14px; }
        .pv-btn { background: rgba(0,229,255,0.12); border: 1px solid rgba(0,229,255,0.45); color: #00e5ff; border-radius: 50%; width: 46px; height: 46px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .pv-btn.main { width: 58px; height: 58px; font-size: 22px; background: linear-gradient(135deg, #00e5ff, #00ff88); color: #001014; border: none; box-shadow: 0 0 22px rgba(0,229,255,0.5); }
        .pv-btn:active { transform: scale(0.94); }
        .pv-time { color: #8b98a5; font-size: 12px; font-family: monospace; letter-spacing: 1px; text-align: center; margin-top: 8px; }
        .pv-enter { align-self: center; margin-top: 14px; background: linear-gradient(90deg, #00e5ff, #00ff88); color: #001014; border: none; border-radius: 30px; padding: 13px 36px; font-size: 14px; font-weight: bold; letter-spacing: 2px; cursor: pointer; box-shadow: 0 0 24px rgba(0,229,255,0.5); }
        .pv-enter:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div id="splash-screen">
        <canvas id="matrix-canvas"></canvas>
        <div class="splash-content">
            <div class="splash-logo">👑</div>
            <div class="splash-title">Цифровое Агентство</div>
            <div class="splash-loader-bar"></div>
            <div id="ai-loading-status">Инициализация...</div>
            <div id="ai-loading-bar-container"><div id="ai-loading-progress"></div></div>
            <div id="ai-model-list"></div>
        </div>
    </div>
    <div id="features-preview">
        <canvas id="preview-canvas"></canvas>
        <div class="pv-player">
            <div class="pv-top">
                <span class="pv-badge">ИНСТРУКЦИЯ</span>
                <span class="pv-rec"><span class="rec-dot"></span>REC</span>
                <span class="pv-skip" onclick="closeFeaturesPreview()">Пропустить ✕</span>
            </div>
            <div class="pv-timeline" id="pvTimeline"></div>
            <div class="pv-stage" id="pvStage"></div>
            <div class="pv-caption" id="pvCaption"></div>
            <div class="pv-controls">
                <button class="pv-btn" onclick="previewPrev()" title="Предыдущая сцена">⏮</button>
                <button class="pv-btn main" id="pvPlay" onclick="previewToggle()" title="Пауза / играть">⏸</button>
                <button class="pv-btn" onclick="previewNext()" title="Следующая сцена">⏭</button>
            </div>
            <div class="pv-time" id="pvTime">0:00 / 0:00</div>
            <button class="pv-enter" onclick="closeFeaturesPreview()">ВОЙТИ В ШТАБ →</button>
        </div>
    </div>
    <iframe id="app-frame" src=""></iframe>
    <div id="fab-overlay" onclick="toggleMenu()"></div>
    <div id="control-panel">
        <div id="fab-menu">
            <div id="safe-lock-container">
                <div id="safe-display">____</div>
                <div class="safe-keypad">
                    <button class="safe-key" onclick="pressSafeKey('1')">1</button>
                    <button class="safe-key" onclick="pressSafeKey('2')">2</button>
                    <button class="safe-key" onclick="pressSafeKey('3')">3</button>
                    <button class="safe-key" onclick="pressSafeKey('4')">4</button>
                    <button class="safe-key" onclick="pressSafeKey('5')">5</button>
                    <button class="safe-key" onclick="pressSafeKey('6')">6</button>
                    <button class="safe-key" onclick="pressSafeKey('7')">7</button>
                    <button class="safe-key" onclick="pressSafeKey('8')">8</button>
                    <button class="safe-key" onclick="pressSafeKey('9')">9</button>
                    <button class="safe-key clear" onclick="clearSafePin()">C</button>
                    <button class="safe-key" onclick="pressSafeKey('0')">0</button>
                    <button class="safe-key ok" onclick="checkSafePin()">OK</button>
                </div>
            </div>
            <div id="save-action-container" style="display:none;">
                <button class="fab-btn btn-backup" onclick="triggerBackup()" style="width:100%;"><span class="title">💾 Сохранить эталон</span></button>
            </div>
            <button class="fab-btn btn-rollback" onclick="triggerRollback()"><span class="title">⏪ Откатить Штаб</span></button>
        </div>
        <button id="fab-trigger" onclick="toggleMenu()">🛠️</button>
    </div>
    <script>
        const PROXY = "https://shtab-boss.duckdns.org:8443";

        // === СБОРКА ОБОЛОЧКИ (index.html) ===
        // shellBuild в shtab_version.json — это сборка ИМЕННО оболочки.
        // Обычные правки Штаба (build = app.html) оболочку больше НЕ дёргают:
        // их подхватывает «ЖИВОЕ ОБНОВЛЕНИЕ» ниже, без перезагрузки страницы.
        // ВАЖНО: читаем СВОЙ файл shtab_version.json, а не общий version.json —
        // тот принадлежит Калькулятору окон (window_calc) и с Штабом не перемешивается.
        window.SHTAB_SHELL_BUILD = 69;

        const fabMenu = document.getElementById('fab-menu');
        const fabOverlay = document.getElementById('fab-overlay');
        let appFrame = document.getElementById('app-frame');
        const splashScreen = document.getElementById('splash-screen');
        appFrame.src = "app.html?v=" + Date.now();

        // === ЖИВОЕ ОБНОВЛЕНИЕ ШТАБА — БЕЗ ВИДИМЫХ ПЕРЕЗАГРУЗОК ===
        // Босс: «версия наверху сменилась, а Штаб не обновился» + «хочу, чтобы
        // Штаб обновлялся сам, без видимых перезагрузок».
        // Причина расхождения: плашка версии читает shtab_version.json ЖИВЬЁМ,
        // а сам кадр app.html оставался старым из кэша браузера.
        // Теперь оболочка целиком НЕ перезагружается (заставка не мигает): новый
        // app.html грузится СКРЫТО в невидимый кадр и подменяет старый только
        // когда полностью готов. Пустого экрана и мигания нет.
        (function () {
            const SHELL_BUILD = 69;
            const SILENT_KEY = 'shtabSilentBoot';
            const STUCK_KEY = 'shtabShellReloadBuild';
            let frameBuild = 0;      // сборка кадра, которая сейчас на экране
            let swapping = false;

            function remember(build) {
                if (build) frameBuild = build;
                try { sessionStorage.setItem('shtabShellAppBuild', String(frameBuild)); } catch (e) {}
            }

            // Кадр сам сообщает свою сборку — так оболочка знает, что на экране.
            window.addEventListener('message', function (e) {
                const d = e.data || {};
                if (d.type === 'shtab-frame-build') {
                    remember(parseInt(d.build, 10));
                    try { sessionStorage.removeItem(STUCK_KEY); } catch (er) {}
                } else if (d.type === 'shtab-need-swap') {
                    hotSwap(parseInt(d.build, 10));
                } else if (d.type === 'shtab-replay-preview') {
                    // Кнопка «🎬 Инструкция» в кадре просит показать превью заново.
                    replayFeaturesPreview();
                }
            });

            // Бесшовная подмена кадра: новый грузится скрыто, старый убирается
            // только после полной готовности нового.
            function hotSwap(build) {
                if (swapping) return;
                swapping = true;
                const next = document.createElement('iframe');
                next.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;border:none;opacity:0;pointer-events:none;';
                next.src = 'app.html?v=' + Date.now();
                let settled = false;
                next.onload = function () {
                    if (settled) return;
                    settled = true;
                    const old = document.getElementById('app-frame');
                    // Старому кадру говорим «меняю тебя» — чтобы он не перезагружал себя сам.
                    try { if (old && old.contentWindow) old.contentWindow.postMessage({ type: 'shtab-swap-ok' }, '*'); } catch (e) {}
                    next.id = 'app-frame';
                    next.style.opacity = '1';
                    next.style.pointerEvents = 'auto';
                    next.onload = null;
                    if (old && old.parentNode) old.parentNode.removeChild(old);
                    appFrame = next;
                    remember(build);
                    swapping = false;
                };
                // Страховка: новый кадр не догрузился — снимаем скрытый, старый остаётся.
                setTimeout(function () {
                    if (settled) return;
                    settled = true;
                    try { if (next.parentNode) next.parentNode.removeChild(next); } catch (e) {}
                    swapping = false;
                }, 20000);
                document.body.appendChild(next);
            }

            // Сверка сборок с сервером: при запуске, каждые 25 с и при возврате в Штаб.
            async function check() {
                try {
                    const r = await fetch('shtab_version.json?v=' + Date.now(), { cache: 'no-store' });
                    if (!r.ok) return;
                    const j = await r.json();

                    // 1) Кадр (app.html) отстал — тихий бесшовный подмен.
                    const srv = parseInt(j.build, 10);
                    if (srv && frameBuild && srv > frameBuild) { hotSwap(srv); return; }

                    // 2) Сама оболочка (index.html) отстала — и только если реально
                    // изменилась (поле shellBuild). Перезагружаем БЕЗ заставки.
                    const srvShell = parseInt(j.shellBuild || 0, 10);
                    if (srvShell && srvShell > SHELL_BUILD) {
                        let tries = 0;
                        try { tries = parseInt(sessionStorage.getItem(STUCK_KEY) || '0', 10) || 0; } catch (e) {}
                        if (tries >= 3) return;
                        try {
                            sessionStorage.setItem(STUCK_KEY, String(tries + 1));
                            sessionStorage.setItem(SILENT_KEY, '1');
                        } catch (e) {}
                        location.replace(location.pathname + '?v=' + Date.now());
                    }
                } catch (e) { /* нет shtab_version.json — молча живём дальше */ }
            }
            check();
            setInterval(check, 25000);
            document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
            window.addEventListener('focus', check);

            // Старый закэшированный кадр не умеет представляться. Если через 4 с от
            // него нет метки сборки — он устарел: тихо подменяем на свежий.
            setTimeout(function () {
                if (frameBuild) return;
                let fixed = '0';
                try { fixed = sessionStorage.getItem('shtabStaleFrameFixed') || '0'; } catch (e) {}
                if (fixed === '1') return;
                try { sessionStorage.setItem('shtabStaleFrameFixed', '1'); } catch (e) {}
                hotSwap(0);
            }, 4000);
        })();
        let matrixInterval;
        function startMatrix() {
            const canvas = document.getElementById('matrix-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*'.split('');
            const fontSize = 14; const columns = canvas.width / fontSize; const drops = [];
            for (let x = 0; x < columns; x++) drops[x] = 1;
            function draw() {
                ctx.fillStyle = 'rgba(10, 10, 10, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00e5ff'; ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < drops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            matrixInterval = setInterval(draw, 33);
        }
        startMatrix();
        let appLoaded = false, minTimePassed = false, aiReady = false;
        setTimeout(() => { minTimePassed = true; hideSplashIfReady(); }, 6000); 
        // СТРАХОВКА: нейросеть не отчиталась (модель не скачалась, сеть отвалилась) —
        // не держим Босса на заставке вечно. Через 20 с пускаем в Штаб в любом случае.
        setTimeout(() => { aiReady = true; hideSplashIfReady(); }, 20000);
        appFrame.onload = () => { appLoaded = true; hideSplashIfReady(); };
        window.updateAILoading = function(pct, status, modelsHtml) {
            const s = document.getElementById('ai-loading-status');
            const p = document.getElementById('ai-loading-progress');
            const l = document.getElementById('ai-model-list');
            if (s) s.innerText = status;
            if (p) p.style.width = pct + '%';
            if (l && modelsHtml) l.innerHTML = modelsHtml;
        };
        window.aiLoadingComplete = function() { aiReady = true; hideSplashIfReady(); };
        window.aiLoadingError = function(msg) {
            const el = document.getElementById('ai-loading-status');
            if (el) { el.innerText = "❌ ОШИБКА: " + msg; el.style.color = "#ff3333"; }
        };
        function hideSplashIfReady() {
            if (appLoaded && minTimePassed && aiReady) { splashScreen.classList.add('hidden'); clearInterval(matrixInterval); showFeaturesPreview(); }
            else if (minTimePassed && !appLoaded) { document.querySelector('.splash-title').innerText = "Загрузка Штаба..."; }
            else if (appLoaded && minTimePassed && !aiReady) { document.querySelector('.splash-title').innerText = "Загрузка нейросети..."; }
        }

        /* === ПРЕВЬЮ «ЧТО УМЕЕТ ШТАБ» — ВИДЕО-ИНСТРУКЦИЯ ===
           Показывается ОДИН РАЗ за сессию сразу после заставки. Повторно
           не всплывает (sessionStorage), чтобы не мешать Боссу.
           Босс: «хочу, чтобы как видео выглядело, типа инструкции».
           Каждая карточка — СЦЕНА фильма: иконка, название, текст и
           «озвучка»-субтитр, который печатается по буквам. Сверху —
           сегментный таймлайн (как в сторис), снизу — кнопки ⏮ ⏸ ⏭
           и счётчик времени. Сцены листаются сами, пауза — по кнопке. */
        const PREVIEW_CARDS = [
            { icon: '💬', name: 'АРХИТЕКТОР', text: 'Ставлю задачи словами — Архитектор пишет код, правит файлы и собирает приложения прямо в чате.', tag: 'ЯДРО', narr: 'Просто скажи, что нужно сделать. Архитектор сам напишет код и внедрит его в проект.' },
            { icon: '🅰️', name: 'ZVENO', text: 'Основной канал Архитектора. Держит контекст, помнит историю проекта и ведёт его от идеи до релиза.', tag: 'ONLINE', narr: 'Канал Zveno держит контекст и ведёт проект от идеи до релиза.' },
            { icon: '🟣', name: 'GIGACHAT', text: 'Вторая модель, включается отдельно. В режиме «Дуэт» две модели спорят и выдают лучшее решение.', tag: 'ДУЭТ', narr: 'Включи «Дуэт» — и две модели обсудят задачу прямо в чате, прежде чем начать работу.' },
            { icon: '🏢', name: '3D ОФИС', text: 'Живой офис с агентами. Видно, кто чем занят, можно зайти внутрь и посмотреть.', tag: '3D', narr: 'Загляни в 3D-офис: видно, кто из агентов чем занят прямо сейчас.' },
            { icon: '🗣️', name: 'ГОЛОСА', text: 'Агенты говорят вслух. Своя лаборатория голосов — подбери тембр каждому агенту.', tag: 'TTS', narr: 'Агенты умеют говорить вслух. В лаборатории голосов подбери тембр каждому.' },
            { icon: '📎', name: 'ФОТО И ФАЙЛЫ', text: 'Пришли фото или документ — Штаб разберёт, опишет и сразу сделает работу.', tag: 'ВВОД', narr: 'Пришли фото или файл — Штаб разберёт его и сразу возьмётся за работу.' },
            { icon: '🛠️', name: 'ИНСТРУМЕНТЫ', text: 'GitHub, погода, поиск в сети, картинки — всё под рукой у Архитектора.', tag: 'TOOLS', narr: 'GitHub, погода, поиск в сети и картинки — всё под рукой у Архитектора.' },
            { icon: '🚑', name: 'РЕМОНТ СЕРВЕРА', text: 'Сервер упал? Пошаговая инструкция поднимет Штаб и Чат за пару минут.', tag: '24/7', narr: 'Если сервер упал — пошаговая инструкция поднимет Штаб и Чат за пару минут.' }
        ];
        const PV_DUR = 6500;   // сколько миллисекунд держится одна сцена
        let previewBuilt = false, previewIdx = 0, previewMatrix = null, previewShown = false;
        let pvPlaying = true, pvElapsed = 0, pvTick = null, pvTypeTimer = null, pvHideTimer = null;

        function buildFeaturesPreview() {
            if (previewBuilt) return;
            const tl = document.getElementById('pvTimeline');
            const st = document.getElementById('pvStage');
            if (!tl || !st) return;
            PREVIEW_CARDS.forEach((c) => {
                const seg = document.createElement('div');
                seg.className = 'pv-seg';
                seg.innerHTML = '<i></i>';
                tl.appendChild(seg);
                const sc = document.createElement('div');
                sc.className = 'pv-scene';
                sc.innerHTML = '<div class="pv-icon">' + c.icon + '</div>' +
                    '<div class="pv-name">' + c.name + '</div>' +
                    '<div class="pv-text">' + c.text + '</div>' +
                    '<div class="pv-tag">' + c.tag + '</div>';
                st.appendChild(sc);
            });
            previewBuilt = true;
        }

        function pvFmt(ms) {
            const s = Math.max(0, Math.round(ms / 1000));
            return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        }

        function pvUpdateTime() {
            const el = document.getElementById('pvTime');
            if (!el) return;
            const total = PREVIEW_CARDS.length * PV_DUR;
            const cur = previewIdx * PV_DUR + Math.min(pvElapsed, PV_DUR);
            el.textContent = pvFmt(cur) + ' / ' + pvFmt(total);
        }

        function pvType(text) {
            const el = document.getElementById('pvCaption');
            if (!el) return;
            clearInterval(pvTypeTimer);
            el.textContent = '';
            const s = String(text || '');
            let i = 0;
            pvTypeTimer = setInterval(() => {
                if (!pvPlaying) return;                 // пауза — печать замирает
                if (i >= s.length) { clearInterval(pvTypeTimer); return; }
                el.textContent = s.slice(0, ++i);
            }, 24);
        }

        function pvShow(i, keepPlaying) {
            previewIdx = (i + PREVIEW_CARDS.length) % PREVIEW_CARDS.length;
            pvElapsed = 0;
            document.querySelectorAll('#pvStage .pv-scene').forEach((s, k) => s.classList.toggle('on', k === previewIdx));
            document.querySelectorAll('#pvTimeline .pv-seg').forEach((s, k) => {
                const bar = s.querySelector('i');
                if (bar) bar.style.width = (k < previewIdx) ? '100%' : '0%';
            });
            pvType(PREVIEW_CARDS[previewIdx].narr || PREVIEW_CARDS[previewIdx].text);
            pvUpdateTime();
            if (!keepPlaying) { pvPlaying = true; pvPlayBtn(); }
        }

        function pvPlayBtn() {
            const b = document.getElementById('pvPlay');
            if (b) b.textContent = pvPlaying ? '⏸' : '▶';
        }

        function pvLoop() {
            if (pvTick) return;
            pvTick = setInterval(() => {
                if (!pvPlaying) return;
                pvElapsed += 100;
                const seg = document.querySelectorAll('#pvTimeline .pv-seg')[previewIdx];
                if (seg) {
                    const bar = seg.querySelector('i');
                    if (bar) bar.style.width = Math.min(100, (pvElapsed / PV_DUR) * 100) + '%';
                }
                pvUpdateTime();
                if (pvElapsed >= PV_DUR) {
                    if (previewIdx >= PREVIEW_CARDS.length - 1) {
                        // Последняя сцена доиграла — останавливаемся, ждём Босса.
                        pvPlaying = false; pvElapsed = PV_DUR; pvPlayBtn(); pvUpdateTime();
                    } else {
                        pvShow(previewIdx + 1, true);
                    }
                }
            }, 100);
        }

        function previewToggle() {
            // Дошли до конца и жмём «играть» — начинаем инструкцию заново,
            // иначе кнопка ▶ ничего бы не делала (pvElapsed уже = PV_DUR).
            if (!pvPlaying && previewIdx >= PREVIEW_CARDS.length - 1 && pvElapsed >= PV_DUR) { pvShow(0); return; }
            pvPlaying = !pvPlaying; pvPlayBtn();
        }
        function previewNext() { pvShow(previewIdx + 1, true); }
        function previewPrev() { pvShow(previewIdx - 1, true); }

        function startPreviewMatrix() {
            const canvas = document.getElementById('preview-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%'.split('');
            const fontSize = 14; const columns = canvas.width / fontSize; const drops = [];
            for (let x = 0; x < columns; x++) drops[x] = 1;
            previewMatrix = setInterval(() => {
                ctx.fillStyle = 'rgba(5, 5, 5, 0.08)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00e5ff'; ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < drops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }, 40);
        }

        function showFeaturesPreview() {
            // ВАЖНО: hideSplashIfReady() зовётся несколько раз (6 с, 20 с, onload).
            // Без этого флага превью перезапускалось бы с первой сцены на каждом вызове.
            if (previewShown) return;
            let seen = '0';
            try { seen = sessionStorage.getItem('shtabPreviewSeen') || '0'; } catch (e) {}
            if (seen === '1') return;
            const box = document.getElementById('features-preview');
            if (!box) return;
            previewShown = true;
            buildFeaturesPreview();
            box.classList.add('show');
            startPreviewMatrix();
            pvShow(0);
            pvLoop();
        }

        // Повторный показ инструкции по кнопке «🎬 Инструкция» из кадра.
        // Сбрасываем оба «замка» (флаг показа и метку сессии) и запускаем заново.
        function replayFeaturesPreview() {
            if (pvHideTimer) { clearTimeout(pvHideTimer); pvHideTimer = null; }
            previewShown = false;
            try { sessionStorage.removeItem('shtabPreviewSeen'); } catch (e) {}
            const box = document.getElementById('features-preview');
            if (box) box.style.display = '';
            showFeaturesPreview();
        }

        function closeFeaturesPreview() {
            const box = document.getElementById('features-preview');
            if (!box) return;
            box.classList.remove('show');
            pvPlaying = false;
            if (pvTick) { clearInterval(pvTick); pvTick = null; }
            if (pvTypeTimer) { clearInterval(pvTypeTimer); pvTypeTimer = null; }
            if (previewMatrix) { clearInterval(previewMatrix); previewMatrix = null; }
            try { sessionStorage.setItem('shtabPreviewSeen', '1'); } catch (e) {}
            setTimeout(() => { box.style.display = 'none'; }, 600);
        }
        // ТИХИЙ ЗАПУСК: оболочка обновилась сама (см. «ЖИВОЕ ОБНОВЛЕНИЕ ШТАБА») —
        // заставку не показываем вообще, чтобы Босс не видел перезагрузку.
        try {
            if (sessionStorage.getItem('shtabSilentBoot') === '1') {
                sessionStorage.removeItem('shtabSilentBoot');
                minTimePassed = true; aiReady = true;
                splashScreen.classList.add('hidden');
                clearInterval(matrixInterval);
            }
        } catch (e) {}
        function forceRefresh() {
            if ('caches' in window) { caches.keys().then((names) => { for (let name of names) caches.delete(name); }); }
            window.location.href = window.location.pathname + '?v=' + Date.now();
        }
        let safePin = "", CORRECT_PIN = "8452"; 
        function toggleMenu() { fabMenu.classList.toggle('open'); fabOverlay.classList.toggle('open'); if (fabMenu.classList.contains('open')) resetSafe(); }
        function resetSafe() { safePin = ""; document.getElementById('safe-display').innerText = "____"; document.getElementById('safe-display').style.color = "#00e5ff"; document.getElementById('safe-lock-container').style.display = 'flex'; document.getElementById('save-action-container').style.display = 'none'; }
        function pressSafeKey(num) { if (safePin.length < 4) { safePin += num; document.getElementById('safe-display').innerText = safePin.padEnd(4, '_'); } }
        function clearSafePin() { safePin = ""; document.getElementById('safe-display').innerText = "____"; document.getElementById('safe-display').style.color = "#00e5ff"; }
        function checkSafePin() { if (safePin === CORRECT_PIN) { document.getElementById('safe-display').innerText = "OK"; document.getElementById('safe-display').style.color = "#00ff00"; setTimeout(() => { document.getElementById('safe-lock-container').style.display = 'none'; document.getElementById('save-action-container').style.display = 'block'; }, 300); } else { document.getElementById('safe-display').innerText = "ERR"; document.getElementById('safe-display').style.color = "#ff0000"; setTimeout(clearSafePin, 1000); } }
        // === БЭКАП И ОТКАТ ЧЕРЕЗ СЕРВЕР (токен только в памяти сервера, у пользователя не спрашиваем) ===
        async function shtabBackup(isBackup) {
            const res = await fetch(PROXY, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(isBackup ? { isBackup: true, isBoss: true } : { isRollback: true, isBoss: true })
            });
            let data = null;
            try { data = await res.json(); } catch (_e) { data = null; }
            if (!data) throw new Error("Сервер не ответил");
            if (!data.success) throw new Error(data.error || "Ошибка сервера");
            return data.message || "Готово";
        }
        async function triggerBackup() { toggleMenu(); if (!confirm("💾 Сохранить эталон?")) return; try { alert("✅ " + await shtabBackup(true)); } catch (e) { alert("❌ " + e.message); } }
        async function triggerRollback() { toggleMenu(); if (!confirm("⚠️ Откатить Штаб?")) return; try { alert("✅ " + await shtabBackup(false)); appFrame.src = "app.html?v=" + Date.now(); } catch (e) { alert("❌ " + e.message); } }
    </script>
</body>
</html>
