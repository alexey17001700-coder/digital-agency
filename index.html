<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровое Агентство (OpenRouter)</title>
    <style>
        body { background-color: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        h1 { color: #00e5ff; text-align: center; font-size: 22px; }
        .chat-container { background: #121212; border: 2px solid #ffd700; border-radius: 10px; padding: 15px; height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .msg-director { background: #2c3e50; color: #ffd700; align-self: flex-start; }
        .msg-boss { background: #005662; color: #fff; align-self: flex-end; }
        .input-area { display: flex; gap: 10px; margin-top: 20px; }
        input[type="text"] { flex-grow: 1; padding: 12px; border-radius: 25px; border: 1px solid #333; background: #1e1e1e; color: white; }
        button.send-btn { padding: 12px 20px; background: #00e5ff; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🏢 Агентство (OpenRouter)</h1>
    <div class="chat-container" id="chatContainer">
        <div class="chat-msg msg-director">Босс, Директор на связи. Подключен к OpenRouter. Жду задачу!</div>
    </div>
    <div class="input-area">
        <input type="text" id="chatInput" placeholder="Написать задачу..." onkeypress="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        
        // Берем ключ из ссылки (?key=sk-or-v1-...)
        const urlParams = new URLSearchParams(window.location.search);
        const OPENROUTER_KEY = urlParams.get('key') || "";
        
        // Твой прокси-воркер из Cloudflare
        const PROXY = "https://openrouter-proxy.alexey17001700.workers.dev";

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = 'chat-msg msg-' + sender;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, 'boss');
            input.value = '';
            
            if (!OPENROUTER_KEY) {
                addMessage("Ошибка: Добавь ?key=ТВОЙ_КЛЮЧ в конец адреса сайта.", 'director');
                return;
            }

            try {
                const response = await fetch(PROXY + "/api/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + OPENROUTER_KEY
                        // Убрали HTTP-Referer и X-Title, чтобы OpenRouter не блокировал
                    },
                    body: JSON.stringify({
                        model: "meta-llama/llama-3-8b-instruct:free",
                        messages: [{ role: "user", content: text }]
                    })
                });
                
                const data = await response.json();
                
                if (data.choices && data.choices.length > 0) {
                    addMessage(data.choices[0].message.content, 'director');
                } else {
                    addMessage("Ошибка: " + JSON.stringify(data), 'director');
                }
            } catch (e) { 
                addMessage("Ошибка связи: " + e.message, 'director'); 
            }
        }
    </script>
</body>
</html>
