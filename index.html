    <style>
        /* ЖЕСТКАЯ ФИКСАЦИЯ ЭКРАНА */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #050505; 
            font-family: 'Segoe UI', sans-serif;
            position: fixed; 
            top: 0; left: 0;
        }
        
        #app-frame {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            border: none; display: block;
        }

        /* --- СТИЛИ ЗАСТАВКИ (SPLASH SCREEN) --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0a0a0a;
            z-index: 9999999;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }
        
        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        #matrix-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .splash-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .splash-logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float-crown 2s infinite ease-in-out, glow-crown 1.5s infinite alternate;
        }

        @keyframes float-crown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes glow-crown {
            from { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5)); }
            to { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 1)); }
        }

        .splash-title {
            color: #00e5ff;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
            animation: pulse-text 2s infinite alternate;
        }

        @keyframes pulse-text {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }

        .splash-loader-bar {
            width: 200px;
            height: 4px;
            background: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .splash-loader-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; height: 100%; width: 50%;
            background: #00e5ff;
            border-radius: 10px;
            animation: loading 1.5s infinite ease-in-out;
            box-shadow: 0 0 10px #00e5ff;
        }

        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        /* --- СТИЛИ ПРИЛОЖЕНИЯ --- */
        #control-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        #fab-trigger {
            width: 40px; height: 40px; border-radius: 50%;
            background: #1e1e1e; border: 2px solid #ffd700; color: #ffd700;
            font-size: 18px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 3px 10px rgba(255, 215, 0, 0.3);
            animation: pulse-ring 2s infinite; transition: transform 0.2s;
        }

        #fab-trigger:active { transform: scale(0.9); }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        #fab-menu {
            display: none; flex-direction: column; gap: 10px;
            background: rgba(30, 30, 30, 0.95); border: 1px solid #444;
            border-radius: 16px; padding: 15px; width: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            position: absolute; top: 50px; right: 0; animation: slide-down 0.3s ease;
        }

        #fab-menu.open { display: flex; }

        @keyframes slide-down {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .fab-btn {
            display: flex; flex-direction: column; align-items: flex-start;
            padding: 12px; border-radius: 10px; border: none; cursor: pointer;
            text-align: left; transition: all 0.2s;
        }

        .fab-btn:active { transform: scale(0.96); }
        .fab-btn .title { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        .fab-btn .desc { font-size: 10px; opacity: 0.8; line-height: 1.3; }

        .btn-backup { background: rgba(0, 200, 100, 0.15); color: #00ff88; border: 1px solid rgba(0, 200, 100, 0.3); }
        .btn-rollback { background: rgba(255, 0, 85, 0.15); color: #ff4477; border: 1px solid rgba(255, 0, 85, 0.3); margin-top: 5px; }

        /* СТИЛИ ДЛЯ СЕЙФА */
        #safe-lock-container { display: flex; flex-direction: column; align-items: center; background: #121212; border: 1px solid #333; border-radius: 12px; padding: 10px; }
        .safe-hint { font-size: 12px; color: #aaa; margin-bottom: 5px; }
        #safe-display { width: 100%; background: #000; color: #00e5ff; font-family: monospace; font-size: 20px; text-align: center; padding: 8px 0; border-radius: 5px; margin-bottom: 10px; letter-spacing: 5px; border: 1px solid #333; }
        .safe-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 100%; }
        .safe-key { background: #2a2a2a; color: #fff; border: none; border-radius: 5px; padding: 10px 0; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .safe-key:active { background: #444; }
        .safe-key.ok { background: #005662; color: #00e5ff; font-weight: bold; font-size: 12px; }
        .safe-key.clear { background: #662222; color: #ff8888; }

        #save-action-container { display: none; animation: slide-down 0.3s ease; }
        #fab-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99998; }
        #fab-overlay.open { display: block; }
    </style>

    <script>
        const PROXY = "https://early-amoeba-1705.alexey17001700.deno.net";
        const fabMenu = document.getElementById('fab-menu');
        const fabOverlay = document.getElementById('fab-overlay');
        const appFrame = document.getElementById('app-frame');
        const splashScreen = document.getElementById('splash-screen');
        // Грузим Штаб с защитой от кэша
        appFrame.src = "app.html?v=" + Date.now();
        // --- ЭФФЕКТ МАТРИЦЫ ---
        let matrixInterval;
        function startMatrix() {
            const canvas = document.getElementById('matrix-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*'.split('');
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = [];
            
            for (let x = 0; x < columns; x++) drops[x] = 1;

            function draw() {
                ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#00e5ff'; // Неоново-голубой
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }
            matrixInterval = setInterval(draw, 33);
        }
        startMatrix();

        // --- УПРАВЛЕНИЕ ЗАСТАВКОЙ ---
let appLoaded = false;
let minTimePassed = false;

// Минимальное время показа заставки (6 секунд)
setTimeout(() => {
    minTimePassed = true;
    hideSplashIfReady();
}, 6000); 

appFrame.onload = () => {
    appLoaded = true;
    hideSplashIfReady();
};

function hideSplashIfReady() {
    if (appLoaded && minTimePassed) {
        splashScreen.classList.add('hidden');
        clearInterval(matrixInterval); 
    } else if (minTimePassed && !appLoaded) {
        // Если 6 секунд прошло, а Штаб не загрузился — пишем "Загрузка..."
        const title = document.querySelector('.splash-title');
        if (title) title.innerText = "Загрузка Штаба...";
    }
}

// Если через 15 секунд Штаб так и не загрузился — показываем ошибку
setTimeout(() => {
    if (!appLoaded) {
        const loader = document.querySelector('.splash-loader-bar');
        if (loader) loader.style.display = 'none';
        const title = document.querySelector('.splash-title');
        if (title) title.innerHTML = "Сбой загрузки.<br><small style='font-size:12px; color:#ff0055;'>Проверьте интернет</small>";
    }
}, 15000);

        // --- СЕЙФ ---
        let safePin = "";
        const CORRECT_PIN = "8452"; 

        function toggleMenu() {
            fabMenu.classList.toggle('open');
            fabOverlay.classList.toggle('open');
            if (fabMenu.classList.contains('open')) resetSafe();
        }

        function resetSafe() {
            safePin = "";
            document.getElementById('safe-display').innerText = "____";
            document.getElementById('safe-display').style.color = "#00e5ff";
            document.getElementById('safe-lock-container').style.display = 'flex';
            document.getElementById('save-action-container').style.display = 'none';
        }

        function pressSafeKey(num) {
            if (safePin.length < 4) {
                safePin += num;
                document.getElementById('safe-display').innerText = safePin.padEnd(4, '_');
            }
        }

        function clearSafePin() {
            safePin = "";
            document.getElementById('safe-display').innerText = "____";
            document.getElementById('safe-display').style.color = "#00e5ff";
        }

        function checkSafePin() {
            if (safePin === CORRECT_PIN) {
                document.getElementById('safe-display').innerText = "OK";
                document.getElementById('safe-display').style.color = "#00ff00";
                setTimeout(() => {
                    document.getElementById('safe-lock-container').style.display = 'none';
                    document.getElementById('save-action-container').style.display = 'block';
                }, 300);
            } else {
                document.getElementById('safe-display').innerText = "ERR";
                document.getElementById('safe-display').style.color = "#ff0000";
                setTimeout(clearSafePin, 1000);
            }
        }

        // --- БЭКАП И ОТКАТ ---
        async function triggerBackup() {
            toggleMenu();
            if (!confirm("💾 Сделать текущую версию Штаба новым эталоном?")) return;
            const btn = document.querySelector('.btn-backup');
            btn.innerHTML = '<span class="title">⏳ Сохранение...</span>';
            try {
                const response = await fetch(PROXY, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ isBackup: true }) });
                const data = await response.json();
                if (data.success) alert("✅ Сохранено!");
                else throw new Error(data.error);
            } catch (e) { alert("❌ Ошибка: " + e.message); } 
            finally { btn.innerHTML = '<span class="title">💾 Сохранить эталон</span><span class="desc">Сделать текущую версию базовой.</span>'; }
        }

        async function triggerRollback() {
            toggleMenu();
            if (!confirm("⚠️ Откатить Штаб?")) return;
            const btn = document.querySelector('.btn-rollback');
            btn.innerHTML = '<span class="title">⏳ Откат...</span>';
            try {
                const response = await fetch(PROXY, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ isRollback: true }) });
                const data = await response.json();
                if (data.success) {
                    alert("✅ Откат выполнен!");
                    appFrame.src = "app.html?v=" + Date.now(); 
                } else throw new Error(data.error);
            } catch (e) { alert("❌ Ошибка: " + e.message); } 
            finally { btn.innerHTML = '<span class="title">⏪ Откатить Штаб</span><span class="desc">Вернуть к последней версии.</span>'; }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
        }
    </script>
