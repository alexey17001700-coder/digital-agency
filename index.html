<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Крестики-нолики</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0a0a0a 70%);
        font-family: 'Segoe UI', sans-serif; color: #fff;
        display: flex; justify-content: center; align-items: center;
        overflow: hidden; user-select: none;
    }
    .game {
        width: 100%; max-width: 380px; padding: 20px;
        display: flex; flex-direction: column; align-items: center; gap: 18px;
    }
    h1 {
        margin: 0; font-size: 24px; letter-spacing: 2px; text-transform: uppercase;
        color: #00e5ff; text-shadow: 0 0 12px rgba(0,229,255,0.6);
    }
    .status {
        font-size: 16px; font-weight: bold; min-height: 24px;
        color: #ffd700; text-shadow: 0 0 8px rgba(255,215,0,0.4);
        transition: color 0.2s;
    }
    .status.win { color: #00ff88; text-shadow: 0 0 12px rgba(0,255,136,0.7); }
    .status.draw { color: #ff4477; text-shadow: 0 0 12px rgba(255,68,119,0.7); }

    .board {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        width: 100%; aspect-ratio: 1 / 1;
    }
    .cell {
        background: rgba(30,30,30,0.9); border: 2px solid #333; border-radius: 14px;
        display: flex; justify-content: center; align-items: center;
        font-size: 52px; font-weight: bold; cursor: pointer;
        transition: background 0.15s, border-color 0.15s, transform 0.1s;
        color: #00e5ff;
    }
    .cell:active { transform: scale(0.96); }
    .cell.x { color: #00e5ff; text-shadow: 0 0 15px rgba(0,229,255,0.8); }
    .cell.o { color: #ff4477; text-shadow: 0 0 15px rgba(255,68,119,0.8); }
    .cell.win {
        background: rgba(0,255,136,0.15); border-color: #00ff88;
        animation: pulse 0.6s infinite alternate;
    }
    @keyframes pulse { from { box-shadow: 0 0 0 rgba(0,255,136,0.3); } to { box-shadow: 0 0 20px rgba(0,255,136,0.8); } }
    .cell:not(.taken):hover { background: rgba(50,50,50,0.9); border-color: #555; }

    .controls { display: flex; gap: 12px; width: 100%; }
    button {
        flex: 1; padding: 14px; border: none; border-radius: 12px;
        font-size: 15px; font-weight: bold; cursor: pointer;
        transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    .btn-reset { background: #00e5ff; color: #000; }
    .btn-mode { background: #1e1e1e; color: #ffd700; border: 2px solid #ffd700; }
    .score {
        display: flex; gap: 20px; font-size: 14px; color: #aaa;
    }
    .score b { color: #fff; }
</style>
</head>
<body>
<div class="game">
    <h1>Крестики-нолики</h1>
    <div class="status" id="status">Твой ход (✕)</div>
    <div class="board" id="board"></div>
    <div class="score">
        <span>✕ Победы: <b id="scoreX">0</b></span>
        <span>Ничьи: <b id="scoreD">0</b></span>
        <span>◯ Победы: <b id="scoreO">0</b></span>
    </div>
    <div class="controls">
        <button class="btn-mode" id="modeBtn" onclick="toggleMode()">🤖 Против ИИ</button>
        <button class="btn-reset" onclick="resetGame()">🔄 Заново</button>
    </div>
</div>

<script>
    const WIN_LINES = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    let board = Array(9).fill('');
    let current = 'X';
    let gameOver = false;
    let vsAI = true;
    let scores = { X: 0, O: 0, D: 0 };

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const modeBtn = document.getElementById('modeBtn');

    function buildBoard() {
        boardEl.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.index = i;
            cell.addEventListener('click', () => handleClick(i));
            boardEl.appendChild(cell);
        }
    }

    function render() {
        const cells = boardEl.children;
        for (let i = 0; i < 9; i++) {
            cells[i].textContent = board[i] === 'X' ? '✕' : board[i] === 'O' ? '◯' : '';
            cells[i].className = 'cell' + (board[i] ? ' taken ' + board[i].toLowerCase() : '');
        }
    }

    function handleClick(i) {
        if (gameOver || board[i] !== '') return;
        if (vsAI && current === 'O') return;
        makeMove(i, current);
        if (!gameOver && vsAI && current === 'O') {
            setTimeout(aiMove, 350);
        }
    }

    function makeMove(i, player) {
        board[i] = player;
        render();
        const win = checkWin(player);
        if (win) {
            gameOver = true;
            highlightWin(win);
            scores[player]++;
            updateScores();
            statusEl.textContent = (player === 'X' ? '✕' : '◯') + ' победил!';
            statusEl.className = 'status win';
            return;
        }
        if (board.every(c => c !== '')) {
            gameOver = true;
            scores.D++;
            updateScores();
            statusEl.textContent = 'Ничья!';
            statusEl.className = 'status draw';
            return;
        }
        current = current === 'X' ? 'O' : 'X';
        updateStatus();
    }

    function checkWin(player) {
        for (const line of WIN_LINES) {
            if (line.every(idx => board[idx] === player)) return line;
        }
        return null;
    }

    function highlightWin(line) {
        const cells = boardEl.children;
        line.forEach(idx => cells[idx].classList.add('win'));
    }

    function updateStatus() {
        statusEl.className = 'status';
        if (current === 'X') statusEl.textContent = 'Твой ход (✕)';
        else statusEl.textContent = vsAI ? 'Ход ИИ...' : 'Ход игрока (◯)';
    }

    function updateScores() {
        document.getElementById('scoreX').textContent = scores.X;
        document.getElementById('scoreO').textContent = scores.O;
        document.getElementById('scoreD').textContent = scores.D;
    }

    function aiMove() {
        if (gameOver) return;
        const move = bestMove();
        if (move !== -1) makeMove(move, 'O');
    }

    function bestMove() {
        // 1. Победный ход
        for (let i = 0; i < 9; i++) {
            if (board[i] === '') {
                board[i] = 'O';
                const w = checkWin('O');
                board[i] = '';
                if (w) return i;
            }
        }
        // 2. Блокировка игрока
        for (let i = 0; i < 9; i++) {
            if (board[i] === '') {
                board[i] = 'X';
                const w = checkWin('X');
                board[i] = '';
                if (w) return i;
            }
        }
        // 3. Центр
        if (board[4] === '') return 4;
        // 4. Углы
        const corners = [0, 2, 6, 8].filter(i => board[i] === '');
        if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
        // 5. Любая свободная
        const free = board.map((v, i) => v === '' ? i : -1).filter(i => i !== -1);
        return free.length ? free[Math.floor(Math.random() * free.length)] : -1;
    }

    function toggleMode() {
        vsAI = !vsAI;
        modeBtn.textContent = vsAI ? '🤖 Против ИИ' : '👥 Два игрока';
        resetGame();
    }

    function resetGame() {
        board = Array(9).fill('');
        current = 'X';
        gameOver = false;
        render();
        updateStatus();
    }

    buildBoard();
    render();
    updateStatus();
</script>
</body>
</html>
