    <link rel="stylesheet" id="main-css">
    <script>
        const timestamp = new Date().getTime();
        document.getElementById('main-css').href = `style.css?v=${timestamp}`;

        // Загрузка одного скрипта с честной очисткой таймера.
        function loadScript(src, isModule) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = `${src}?v=${timestamp}`;
                // Обычный (classic) скрипт: office3d.js использует только
                // динамический import(), которому type="module" не нужен.
                // Classic-скрипт грузится надёжнее — без ограничений модулей.
                if (isModule) script.type = 'module';
                const timer = setTimeout(() => {
                    reject(new Error('Таймаут загрузки: ' + src));
                }, 15000);
                script.onload = () => { clearTimeout(timer); resolve(); };
                script.onerror = () => { clearTimeout(timer); reject(new Error('Не загрузился: ' + src)); };
                document.body.appendChild(script);
            });
        }

        // Кнопка «Офис»: сначала 3D, и только если 3D-модуль реально не поднялся —
        // 2D-фолбэк. Раньше при сбое office3d.js кнопка МОЛЧА открывала 2D-офис,
        // и было непонятно, что 3D не загрузился.
        window.openOffice = function () {
            if (typeof window.openOffice3D === 'function') { window.openOffice3D(); return; }
            if (typeof window.toggleOffice === 'function') { window.toggleOffice(); return; }
            showBootError('3D-офис недоступен: office3d.js не выполнился. Обнови страницу.');
        };

        // Кнопка «Голоса» в панели: если voice.js ещё не загрузился —
        // не молчим, а честно сообщаем. Как только voice.js выполнится,
        // он переопределит openVoiceLab на настоящую лабораторию.
        window.openVoiceLab = function () {
            showBootError('Модуль голосов ещё не загрузился. Обнови страницу.');
        };

        function showBootError(msg) {
            const box = document.createElement('div');
            box.style.cssText = 'position:fixed;bottom:10px;left:10px;right:10px;z-index:99999;background:#440000;color:#ff8888;border:1px solid #ff0055;border-radius:8px;padding:10px;font:12px monospace;';
            box.textContent = '⚠️ ' + msg;
            document.body.appendChild(box);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const scripts = ['agents.js', 'network.js', 'voice.js', 'local_ai.js', 'safe.js', 'chat.js', 'office.js', 'office3d.js', 'ui.js', 'autopilot.js'];
            const failed = [];

            // Грузим параллельно: один упавший файл не тормозит и не ломает остальные.
            await Promise.all(scripts.map(src =>
                loadScript(src, false).catch(e => {
                    failed.push(src);
                    console.error('Ошибка загрузки скрипта', src, e);
                })
            ));

            if (typeof init === 'function') {
                try { init(); }
                catch (e) { console.error('Ошибка init()', e); showBootError('Сбой запуска: ' + e.message); }
            } else {
                showBootError('Не загрузилось ядро (chat.js/ui.js). Проверь связь и обнови страницу.');
            }
            if (failed.length) showBootError('Не загрузились файлы: ' + failed.join(', '));

            // СТРАХОВКА: если 3D-модуль не выполнился — пробуем загрузить его ещё раз,
            // и только потом сообщаем о проблеме (без этого кнопка «Офис» молча
            // открывала старый 2D-офис и было непонятно, что случилось).
            if (!window.OFFICE3D_VERSION) {
                console.warn('office3d.js не выполнился — повторная загрузка');
                try { await loadScript('office3d.js', false); } catch (e) { console.error(e); }
                if (!window.OFFICE3D_VERSION) {
                    showBootError('office3d.js не загрузился — 3D-офис недоступен. Обнови страницу.');
                } else if (window.__office3dBootError) {
                    showBootError('office3d.js загрузился, но install() упал: ' + window.__office3dBootError);
                } else {
                    console.log('office3d.js загружен со второй попытки');
                }
            }
        });
    </script>

    function openRecoveryGuide() {
        const body = document.getElementById('recoveryBody');
        if (!body) return;
        if (!body.dataset.built) {
            RECOVERY_STEPS.forEach(step => {
                const wrap = document.createElement('div');
                wrap.style.cssText = 'margin-bottom:16px; background:#121212; border:1px solid #333; border-radius:10px; padding:12px;';

                const h = document.createElement('div');
                h.textContent = step.title;
                h.style.cssText = 'color:#00e5ff; font-weight:bold; font-size:14px; margin-bottom:6px;';
                wrap.appendChild(h);

                if (step.note) {
                    const n = document.createElement('div');
                    n.textContent = step.note;
                    n.style.cssText = 'color:#aaa; font-size:12px; margin-bottom:8px; line-height:1.4;';
                    wrap.appendChild(n);
                }

                const code = document.createElement('pre');
                code.textContent = step.cmds.join('\n');
                code.style.cssText = 'background:#000; color:#00ff88; border:1px solid #222; border-radius:8px; padding:10px; font:12px monospace; white-space:pre-wrap; word-break:break-all; margin:0 0 8px 0;';
                wrap.appendChild(code);

                const btn = document.createElement('button');
                btn.textContent = '📋 Копировать';
                btn.style.cssText = 'background:#00e5ff; color:#000; border:none; border-radius:6px; padding:6px 12px; font-weight:bold; font-size:12px; cursor:pointer;';
                btn.onclick = () => copyRecovery(step.cmds.join('\n'), btn);
                wrap.appendChild(btn);

                body.appendChild(wrap);
            });
            body.dataset.built = '1';
        }
        document.getElementById('recoveryModal').classList.add('active');
    }

    function copyRecovery(text, btn) {
        const done = () => {
            const old = btn.textContent;
            btn.textContent = '✅ Скопировано';
            setTimeout(() => { btn.textContent = old; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopyRecovery(text, done));
        } else {
            fallbackCopyRecovery(text, done);
        }
    }

    function fallbackCopyRecovery(text, done) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed; top:0; left:0; opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { alert('Не удалось скопировать — выдели текст вручную.'); }
        document.body.removeChild(ta);
    }
    </script>

    <script>
    // === ПРОВЕРКА ОБНОВЛЕНИЙ ШТАБА ===
    // Раз в 30 сек Штаб спрашивает version.json (в обход кэша) и сравнивает build
    // с тем, что был при загрузке. Если build изменился — кнопка «Обновить штаб»
    // начинает мигать, в шапке появляется бейдж «⬆ ОБНОВЛЕНИЕ», телефон вибрирует.
    // Фолбэк: если version.json нет — следим за ETag app.html.
    (function () {
        const CHECK_MS = 15000;
        let currentBuild = null;
        let notified = false;
        const SEEN_KEY = 'shtabSeenBuild';

        async function fetchBuild() {
            try {
                const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
                if (r.ok) {
                    const j = await r.json();
                    const v = String(j.build || j.version || '');
                    if (v) return v;
                }
            } catch (e) { /* нет version.json — идём в фолбэк */ }
            try {
                const h = await fetch('app.html?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
                return h.headers.get('etag') || h.headers.get('last-modified') || null;
            } catch (e) { return null; }
        }

        function markUpdate(build) {
            if (notified) return;
            notified = true;

            const btn = document.getElementById('btnRefreshShtab');
            if (btn) {
                btn.classList.add('update-flash');
                btn.textContent = '🔄 НОВАЯ ВЕРСИЯ';
                btn.title = 'Доступна новая версия Штаба (build ' + build + ')';
            }

            const bar = document.querySelector('.status-bar');
            if (bar && !document.getElementById('status-update')) {
                const b = document.createElement('div');
                b.id = 'status-update';
                b.className = 'status-item';
                b.style.cssText = 'cursor:pointer; border-color:#00e5ff; color:#00e5ff;';
                b.textContent = '⬆ ОБНОВЛЕНИЕ';
                b.title = 'Нажми, чтобы обновить Штаб';
                b.onclick = () => refreshShtab();
                bar.appendChild(b);
            }

            if (navigator.vibrate) { try { navigator.vibrate([80, 60, 80]); } catch (e) {} }
            console.log('Штаб: доступна новая версия, build =', build);
        }

        async function check() {
            const build = await fetchBuild();
            if (!build) return;
            if (currentBuild === null) { currentBuild = build; return; }
            if (build !== currentBuild) markUpdate(build);
        }

        window.addEventListener('DOMContentLoaded', () => {
            check();
            setInterval(check, CHECK_MS);
            // Вернулся к телефону из другого приложения — проверяем сразу.
            document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
        });
    })();
    </script>
</body>
</html>
