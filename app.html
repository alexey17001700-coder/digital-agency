<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Цифровое Агентство</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" id="main-css">
    <script>
        const timestamp = new Date().getTime();
        document.getElementById('main-css').href = `style.css?v=${timestamp}`;
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = `${src}?v=${timestamp}`;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        }
        
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await loadScript('agents.js'); 
                await loadScript('network.js'); 
                await loadScript('voice.js'); 
                await loadScript('chat.js'); 
                await loadScript('ui.js'); 
                await loadScript('office.js');
            } catch (e) { console.error('Ошибка загрузки скриптов', e); }
        });
    </script>
</head>
<body>
    <div class="modal-overlay" id="agentModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modalTitle">Агент</h2>
                <button class="modal-close" onclick="closeModal()">✖</button>
            </div>
            <div class="modal-body">
                <div id="modalBody"></div>
                <hr style="border-color: #333; margin: 15px 0;">
                <p style="font-size: 12px; color: #aaa; margin-bottom: 5px;">⚙️ <b>Редактор характера (Промпт):</b></p>
                <textarea id="agentPromptInput" class="modal-textarea" placeholder="Напиши, как агент должен себя вести..."></textarea>
                <button onclick="saveAgentCharacter()" style="width: 100%; padding: 10px; background: #00e5ff; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">💾 Сохранить характер</button>
                <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px; background: #121212; padding: 10px; border-radius: 8px;">
                    <input type="checkbox" id="agentVoiceCheck" style="width: 20px; height: 20px; cursor: pointer;">
                    <label for="agentVoiceCheck" style="font-size: 14px; color: #ddd; cursor: pointer; margin: 0;">Озвучивать этого агента</label>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="contentModal" onclick="if(event.target===this) this.classList.remove('active')">
        <div class="modal-content" style="max-width: 90%; max-height: 80vh; overflow-y: auto; border-color: #ffd700;">
            <div class="modal-header">
                <h2 style="color: #ffd700;">📁 Контент</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button onclick="clearContentFromButton()" style="background: #662222; color: #ff8888; border: 1px solid #ff8888; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer;">🗑️ Очистить</button>
                    <button class="modal-close" style="color: #ff0055; font-size: 24px; border: none; background: none; cursor: pointer; padding: 0;" onclick="document.getElementById('contentModal').classList.remove('active')">✖</button>
                </div>
            </div>
            <div class="modal-body" id="widgets-container"></div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>📂 История чатов</h2>
            <span style="cursor:pointer; font-size: 20px;" onclick="toggleSidebar()">✖</span>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">+ Новый чат</button>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <h1 id="currentChatTitle">Новый чат</h1>
            <div class="status-bar">
                <div class="status-item" id="status-internet" title="Интернет"><span class="dot"></span> <span class="text">NET</span></div>
                <div class="status-item" id="status-ai" title="Нейросеть"><span class="dot"></span> <span class="text">AI</span></div>
                <div class="status-item" id="status-ping" title="Задержка"><span class="text">-- ms</span></div>
                <div class="status-item" id="status-alarm" title="Тревога"><span class="dot"></span> <span class="text">ALARM</span></div>
                <div class="status-item" id="btn-tester" style="cursor:pointer; border-color:#ffd700;" onclick="toggleTester()">📡 ТЕСТ</div>
            </div>
        </div>

        <div class="tester-dropdown" id="testerMenu">
            <div class="tester-title">🛠️ Статус соединений</div>
            <div class="tester-item"><span>📶 Сеть:</span> <span id="t-wifi-type">--</span></div>
            <div class="tester-item"><span>🌐 Интернет:</span> <span id="t-inet-status">--</span></div>
            <div class="tester-item"><span>⚡ Пинг:</span> <span id="t-ping">--</span></div>
            <div class="tester-item"><span>🐙 GitHub:</span> <span id="t-github">--</span></div>
            <div class="tester-item"><span>🤖 ИИ Модель:</span> <span id="t-ai-model">--</span></div>
            <button onclick="runConnectionTest()" style="width:100%; margin-top:10px; padding:8px; background:#00e5ff; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">🔄 Обновить</button>
        </div>

        <div class="mode-switch">
            <button class="mode-btn active" id="btnNormal" onclick="setMode('normal')">Обычный</button>
            <button class="mode-btn" id="btnHacker" onclick="setMode('hacker')">🕵️ Хакер</button>
            <button class="mode-btn" id="btnCouncil" onclick="toggleCouncil()">👥 Совет</button>
            <button class="mode-btn" id="btnVoiceToggle" onclick="toggleVoice()">🗣️ Озвучка: ВЫКЛ</button>
            <button class="mode-btn" onclick="document.getElementById('contentModal').classList.add('active')">📁 Контент</button>
            <button class="mode-btn" id="btnAuto" onclick="toggleAutoMode()">⚡ Авто: ВЫКЛ</button>
            <button class="mode-btn" id="btnOffice" onclick="toggleOffice()">🏢 Офис</button>
        </div>

        <div class="chat-container" id="chatContainer"></div>
        <div id="office-container" style="display: none; width: 100%; height: 100%; position: relative; overflow: hidden;"></div>

        <div class="input-area">
            <textarea id="chatInput" placeholder="Написать задачу..." rows="1"></textarea>
            <div class="send-btn-container">
                <div id="final-time-badge" class="time-badge">0.0s</div>
                <button class="send-btn" id="sendBtn" onclick="handleSendClick()">➤</button>
            </div>
        </div>

        <div class="agents-wrapper">
            <div class="agents-grid" id="agents-grid"></div>
        </div>
    </div>
</body>
    </html>
