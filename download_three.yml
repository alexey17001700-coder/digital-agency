name: Download Three.js
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Download Three.js
        run: |
          mkdir -p lib
          curl -L -o lib/three.module.js https://raw.githubusercontent.com/mrdoob/three.js/r160/build/three.module.js
          ls -lh lib/three.module.js
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add lib/three.module.js
          git commit -m "Auto-download Three.js" || echo "No changes"
          git push
